name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Chrome
        run: pnpm build

      - name: Package Chrome zip
        run: cd dist && zip -r ../TreeLinker_chrome_${{ github.ref_name }}.zip .

      - name: Build Edge
        run: pnpm build-edge

      - name: Package Edge zip
        run: cd dist && zip -r ../TreeLinker_edge_${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            TreeLinker_chrome_${{ github.ref_name }}.zip
            TreeLinker_edge_${{ github.ref_name }}.zip
